[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sl-accessibility"
version = "0.1.0"
description = "Harness for Seoul slope-weather transit walking accessibility analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "geopandas",
  "h3==4.4.2",
  "matplotlib>=3.10.9",
  "networkx",
  "numpy",
  "pandas",
  "polars",
  "pyarrow",
  "pyyaml",
  "shapely",
  "typer",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]
prototype = ["fastapi", "uvicorn[standard]", "scipy"]

[project.scripts]
sl-accessibility = "sl_accessibility.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
